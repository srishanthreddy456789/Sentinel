version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sentinel_timescaledb
    restart: always
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_pass
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: sentinel_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:sentinel_pass@timescaledb:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=sentinel_super_secret_jwt_key_2026
    depends_on:
      - timescaledb
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_celery_worker
    restart: always
    command: celery -A sentinel.workers.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:sentinel_pass@timescaledb:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - timescaledb
      - redis

volumes:
  timescaledb_data:
