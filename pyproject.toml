[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mlops"
version = "1.0.0"
description = "Autonomous ML Monitoring and Self-Healing Platform SDK"
readme = "README.md"
authors = [{ name = "Srishanth", email = "srishanth@sentinel-mlops.dev" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/srishanthreddy456789/Sentinel"
Documentation = "https://github.com/srishanthreddy456789/Sentinel#readme"

[tool.setuptools.packages.find]
where = ["sdk"]
