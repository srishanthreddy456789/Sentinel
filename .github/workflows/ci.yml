name: SENTINEL CI/CD & Eval Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_user
          POSTGRES_PASSWORD: sentinel_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e .

      - name: Run Pytest & Eval Gate
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel_user:sentinel_pass@localhost:5432/sentinel_db
          JWT_SECRET: test_secret_key
        run: |
          pytest tests/ -v
