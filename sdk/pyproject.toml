[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mlops"
version = "3.0.0"
description = "Official Python SDK for SENTINEL Autonomous LLMOps & Self-Healing Platform"
readme = "README.md"
authors = [{ name = "Srishanth Reddy", email = "srishanthreddy311030@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/srishanthreddy456789/Sentinel"
Documentation = "https://github.com/srishanthreddy456789/Sentinel/tree/main/sdk"
Repository = "https://github.com/srishanthreddy456789/Sentinel/tree/main/sdk"

[tool.setuptools.packages.find]
where = ["."]
